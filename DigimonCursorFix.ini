; DigimonCursorFix - settings
; This file must sit next to DigimonCursorFix.asi and have the same name (different extension).
; When the file is missing, the defaults shown below apply.
; Values: 1 = on, 0 = off. Changes take effect after restarting the game.

[CursorFix]

; SetCursorPos: the game cannot move (re-center) the cursor; the call is just acknowledged.
; This is the setting that fixes the cursor snapping back to the center of the screen.
HookSetCursorPos=1

; GetCursorPos: the game gets a fixed position (see Mode) instead of the real mouse position.
HookGetCursorPos=1

; ShowCursor: the system cursor always stays hidden, whatever the game asks for.
HookShowCursor=1

; GetCursorInfo: same fake position as GetCursorPos (everything else stays real).
HookGetCursorInfo=1

; ClipCursor: the game cannot lock the cursor inside its window.
HookClipCursor=0

; Mouse camera mode, for players who want to turn the camera with the mouse.
;   0 = off (default): the cursor never moves, the camera is turned with the keyboard/controller.
;   1 = on: the game may re-center the cursor in the world, so the mouse camera works.
;       When a menu or battle opens, the cursor is put back where you left it (see MenuCursor).
;       With MouseCamera=1 the Hook... and Mode settings above and below are not used
;       for SetCursorPos, GetCursorPos, GetCursorInfo and ClipCursor.
MouseCamera=0

; Where to put the cursor when a menu or battle opens (MouseCamera=1 only):
;   1 = where you left it the last time (default)
;   2 = fixed position MenuCursorX/MenuCursorY, in percent of the game window
;       (0,0 = top left corner, 50,50 = center, 100,100 = bottom right corner)
MenuCursor=1
MenuCursorX=100
MenuCursorY=100

; Which cursor position to report to the game:
;   1 = fixed position OffscreenX/OffscreenY (default: far off-screen)
;   2 = center of the game window
Mode=1
OffscreenX=-9999
OffscreenY=-9999

; Log DigimonCursorFix.log next to the .asi: which hooks were installed and how often
; the game called each function. Useful when reporting an issue.
Log=1
LogIntervalSeconds=10
