; DigimonCursorFix - DIAGNOSTIC settings (see DIAGNOSTICS.md)
; With these settings the plugin changes nothing: the game behaves exactly as without it,
; including the cursor re-centering. The plugin only writes a detailed log.

[CursorFix]

; Install all hooks so that every call can be watched...
HookSetCursorPos=1
HookGetCursorPos=1
HookShowCursor=1
HookGetCursorInfo=1
HookClipCursor=1

; ...but let every call through to the original function.
Observe=1

; Log every SetCursorPos call (time, target, real cursor position, place in the game code)
; and watch raw input.
Trace=1

; Key that writes a numbered marker into the log (virtual-key code, decimal, 0 = off).
;   F9 = 120 (default)   F8 = 119   F7 = 118   Insert = 45   Home = 36   End = 35
; Avoid F10 (Windows menu key) and F12 (Steam screenshot).
MarkerKey=120

Mode=1
OffscreenX=-9999
OffscreenY=-9999

Log=1
LogIntervalSeconds=1
